<script>
/* ============================================================
   LOGO: ganti alamat di bawah ini dengan alamat logo Anda di GitHub.

const LOGO='https://raw.githubusercontent.com/USERNAME/NAMA-REPO/main/logo.png';

const $=s=>$$(s),$$=s=>document.querySelector(s);
const shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const rng=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
/* ===== Akun & kemajuan ===== */
let PR={},U=null;
try{U=JSON.parse(localStorage.getItem('tk-u')||'null')}catch(e){}

const gs=()=>window.google&&google.script&&google.script.run;
const call=(fn,...a)=>new Promise((ok,no)=>{if(!gs())return no('Tidak terhubung ke server');const r=google.script.run.withSuccessHandler(x=>x&&x.err?no(x.err):ok(x)).withFailureHandler(e=>no((e&&e.message)||'Gagal terhubung'));r[fn](...a)});
const murid=()=>U&&U.peran==='murid';
function load(){if(!murid())return;call('getProfil',U.tk).then(r=>{const o=JSON.parse(r.kem||'{}');for(const k in o)PR[k]=Math.max(PR[k]||0,o[k]);U.kelas=r.kelas;U.lanjut=!!r.lanjut;try{localStorage.setItem('tk-u',JSON.stringify(U));localStorage.setItem(pk(),JSON.stringify(PR))}catch(e){}if(S.v==='home'||S.v==='cat')render()}).catch(e=>{if(/sesi/i.test(e))logout()})}
function save(){try{localStorage.setItem(pk(),JSON.stringify(PR))}catch(e){}if(murid())call('simpanKemajuan',U.tk,JSON.stringify(PR)).catch(()=>{})}
const rec=(k,l,b,st)=>{if(murid())call('simpanNilai',U.tk,k,l+1,b,st).catch(()=>{})};
const tot=()=>Object.values(PR).reduce((a,b)=>a+b,0);
const key=(c,l)=>c+'.'+l;
/* Materi per kelas: KB hanya dasar (kecuali dibuka guru); TK-A/TK-B melihat semua + tanda Rekomendasi */
const ADV={huruf:rng(6,15),angka:rng(5,13),hijaiyah:rng(5,11)};

const hidFor=(kl,lj)=>(k,i)=>kl==='KB'&&!lj&&(ADV[k]||[]).includes(i);
const hid=(k,i)=>murid()&&hidFor(U.kelas,U.lanjut)(k,i);
const rek=(k,i)=>murid()&&((REK[U.kelas]||{})[k]||[]).includes(i);
/* ===== Suara & efek bunyi ===== */
let AC,warned=0;
const tone=(f,d,t)=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const n=AC.currentTime+(t||0),o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.setValueAtTime(.25,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}};
const sfx=k=>k===2?tone(660,.1):k?[523,659,784,1047].forEach((f,i)=>tone(f,.25,i*.12)):[260,200].forEach((f,i)=>tone(f,.3,i*.18));
function note(){if(warned)return;warned=1;const d=document.createElement('p');d.className='hello';d.textContent='🔇 Suara bicara bahasa Indonesia belum tersedia di perangkat ini. Coba Chrome/Safari atau pasang suara Indonesia di pengaturan. Efek bunyi tetap aktif.';$$('#app').insertBefore(d,$$('#mn'))}
const say=t=>{try{const ss=window.speechSynthesis;if(!ss||!window.SpeechSynthesisUtterance)throw 0;ss.cancel();const u=new SpeechSynthesisUtterance(String(t).replace(/[^\p{L}\p{N}\s.,?!+=-]/gu,'')),vs=ss.getVoices(),v=vs.find(x=>/^id/i.test(x.lang));if(v)u.voice=v;u.lang='id-ID';u.rate=.8;u.pitch=1.2;setTimeout(()=>ss.speak(u),60);if(!v&&vs.length)note()}catch(e){note()}};
/* ===== Pembuat data ===== */
const EM=['🍎','🐥','⭐','🎈','🍓','🐟','🌸','🚗','🍪','🐞'];
const em=s=>s.split(';').map(r=>{const[n,e,h]=r.split('|');return{l:n,e,v:`<div class="big em1">${e}</div>`,q:`<div class="big s">${e}</div>`,a:n,p:`Mana ${n}?`,pb:'Apa namanya?',s:h?`${n}. Suaranya ${h}`:n,h:h?'Suaranya: '+h:''}});
const N=['Satu','Dua','Tiga','Empat','Lima','Enam','Tujuh','Delapan','Sembilan','Sepuluh','Sebelas','Dua Belas','Tiga Belas','Empat Belas','Lima Belas','Enam Belas','Tujuh Belas','Delapan Belas','Sembilan Belas','Dua Puluh'];
const TN=['Sepuluh','Dua Puluh','Tiga Puluh','Empat Puluh','Lima Puluh','Enam Puluh','Tujuh Puluh','Delapan Puluh','Sembilan Puluh','Seratus'];
const num=(n,nm,pic)=>({l:`${n} = ${nm}`,v:`<div class="big">${n}</div>${pic?`<div class="em">${EM[(n-1)%10].repeat(n)}</div>`:''}`,q:`<div class="big s">${n}</div>`,a:''+n,p:`Mana angka ${nm.toLowerCase()}?`,s:`${n}. ${nm}`,h:'',t:1});
const cnt=n=>({l:`Ada ${n} = ${N[n-1]}`,v:`<div class="em" style="font-size:2.6rem">${EM[n-1].repeat(n)}</div>`,a:''+n,pb:'Ada berapa?',s:`Ada ${n}. ${N[n-1]}`,h:'',b:1});
const op=(a,b,pl)=>{const r=pl?a+b:a-b,w=pl?'tambah':'kurang';return{l:`${a} ${pl?'+':'−'} ${b} = ${r}`,v:`<div class="em" style="font-size:2.2rem">${'🍎'.repeat(a)} ${pl?'➕':'➖'} ${'🍎'.repeat(b)}</div>`,a:''+r,pb:'Hasilnya berapa?',s:`${a} ${w} ${b} sama dengan ${r}`,h:'',b:1}};
const W='Apel|🍎;Bola|⚽;Cicak|🦎;Domba|🐑;Elang|🦅;Foto|📷;Gajah|🐘;Harimau|🐯;Ikan|🐟;Jeruk|🍊;Kucing|🐱;Lebah|🐝;Mobil|🚗;Nanas|🍍;Onta|🐪;Pisang|🍌;Quran|📖;Roket|🚀;Sapi|🐄;Topi|🎩;Ular|🐍;Vas|🏺;Wortel|🥕;Xilofon|🎹;Yoyo|🪀;Zebra|🦓'.split(';');
const hb=i=>{const L=String.fromCharCode(65+i),[n,e]=W[i].split('|');return{l:`${L} untuk ${n}`,e,v:`<div class="big">${L}${L.toLowerCase()}</div><div class="em">${e}</div>`,q:`<div class="big s">${L}</div>`,qv:`<div class="big em1">${e}</div>`,a:L,p:`Mana huruf ${L}?`,pb:'Gambar ini diawali huruf apa?',s:`Huruf ${L}. ${L} untuk ${n}`,h:''}};
const hk=i=>{const L=String.fromCharCode(65+i),k=L.toLowerCase();return{l:`${L} besar, ${k} kecil`,v:`<div class="big">${k}</div><div class="em">${L}</div>`,q:`<div class="big s">${k}</div>`,qv:`<div class="big">${L}</div>`,a:k,p:`Mana huruf kecil ${k}?`,pb:'Mana huruf kecilnya?',s:`Huruf kecil ${k}`,h:''}};
const tx=(a,p,fs,f)=>a.map((d,i)=>({l:f?f(i,d):d,v:`<div class="big" style="font-size:${fs}rem">${d}</div>`,q:`<div class="t" style="font-size:${fs>3?2:1.6}rem">${d}</div>`,a:d,p:`Mana ${p} ${d}?`,s:d,h:'',t:1}));
const sk=cs=>tx(cs.split('').flatMap(c=>'aiueo'.split('').map(v=>c+v)),'suku kata',3.8);
const kt=s=>s.split(';').map(r=>{const[n,e]=r.split('|');return{l:n,e,v:`<div class="big" style="font-size:3.6rem">${n}</div><div class="em" style="font-size:4.5rem">${e}</div>`,q:`<div class="big s">${e}</div>`,qv:`<div class="big em1">${e}</div>`,a:n,p:`Mana yang bertuliskan ${n}?`,pb:'Apa tulisannya?',s:n,h:''}});
const sw=(c,s)=>`<div class="sw ${s?'s':''}" style="background:${c}"></div>`;
const col=s=>s.split(';').map(r=>{const[n,c,h]=r.split('|');return{l:n,v:sw(c),q:sw(c,1),a:n,p:`Mana warna ${n.toLowerCase()}?`,pb:'Warna apa ini?',s:`Warna ${n}. Seperti ${h}`,h:'Seperti '+h}});
const mix=s=>s.split(';').map(r=>{const[a,ca,b,cb,x,cx]=r.split('|'),m=(z)=>`<div class="row">${sw(ca,1)}➕${sw(cb,1)}＝${z}</div>`;return{l:`${a} + ${b} = ${x}`,v:m(sw(cx,1)),qv:m('<b style="font-size:3rem">❓</b>'),a:x,pb:'Hasil campurannya warna apa?',s:`${a} dicampur ${b} menjadi ${x}`,h:'',b:1}});
const SC=['#e53935','#1e88e5','#fb8c00','#8e24aa','#43a047','#d81b60','#00acc1','#fdd835'];

}
function drawG(){
 const kp=U.peran==='kepsek',all=G.murid,f=kp?(G.f||'Semua'):'',m=f&&f!=='Semua'?all.filter(x=>x.kelas===f):all;
 const wavg=a=>{const k=a.reduce((p,x)=>p+x.kuis,0);return k?Math.round(a.reduce((p,x)=>p+x.rata*x.kuis,0)/k):0};
 const kt=Object.entries(G.kat||{}).map(([k,o])=>[(C[k]||{t:k}).t,Math.round(o.sum/o.n/8*100)]);
 const per=KLS.map(k=>{const a=all.filter(x=>x.kelas===k);return [`${k} (${a.length})`,wavg(a)]});
 $$('#mn').innerHTML=(kp?`<div class="tabs">${['Semua',...KLS].map(k=>`<button class="${f===k?'on':''}" onclick="G.f='${k}';drawG()">${k}</button>`).join('')}</div><h3 class="shelf">🏫 Rata-rata nilai per kelas</h3>${bars(per)}`:`<p class="hello">Kelas <b>${esc(G.kelas)}</b> · ${all.length} murid</p>`)+`<div class="win" style="margin:6px 0"><button onclick="guruv()">🔄 Segarkan</button><a class="lnk" href="${esc(G.url)}" target="_blank" rel="noopener">📊 Spreadsheet</a></div><h3 class="shelf">📈 Rata-rata nilai per materi${kp?' (seluruh sekolah)':''}</h3>${bars(kt)}<h3 class="shelf">🧒 Murid${f&&f!=='Semua'?' '+esc(f):''} (${m.length}) · rata-rata ${wavg(m)}%</h3>`+(m.length?m.map(x=>`<button class="lv" onclick="detail('${x.id}')"><div class="no">${esc((x.nama[0]||'?').toUpperCase())}</div><div><b>${esc(x.nama)}</b> · ${esc(x.kelas)}<br><small>⭐ ${x.bintang} · ${x.kuis} kuis · rata-rata ${x.rata}% · ${x.terakhir||'belum main'}</small></div></button>`).join(''):'<p class="hello">Belum ada murid yang mendaftar.</p>');
}
let DC={};
function detail(id){
 const m=G.murid.find(x=>x.id===id);
 call('detailMurid',U.tk,id).then(r=>{
  let pr={};try{pr=JSON.parse(r.kem||'{}')}catch(e){}
  DC={m,pr,hd:hidFor(m.kelas,r.lanjut)};
  const by={};r.rows.forEach(x=>{if(x[1]!=='puz')(by[x[1]]=by[x[1]]||[]).push(x[3])});
  const kt=Object.entries(by).map(([k,a])=>[(C[k]||{t:k}).t,Math.round(a.reduce((p,v)=>p+v,0)/a.length/8*100)]);
  const tr=r.rows.filter(x=>x[1]!=='puz').slice(0,15).reverse().map(x=>Math.round(x[3]/8*100)),el=elig(pr,DC.hd);
  $$('#mn').innerHTML=`<button class="back" onclick="drawG()" aria-label="Kembali">◀</button><h3 class="shelf">${esc(m.nama)} · ${esc(m.kelas)}</h3><h3 class="shelf">📊 Nilai rata-rata per materi</h3>${bars(kt)}<h3 class="shelf">📈 Perkembangan</h3>${trend(tr)}${m.kelas==='KB'?`<h3 class="shelf">🔓 Materi lanjutan</h3><button class="go" style="width:100%" onclick="lanjut('${id}',${!r.lanjut})">${r.lanjut?'🔒 Kunci kembali materi lanjutan':'🔓 Buka materi lanjutan (suku kata, membaca, tambah-kurang)'}</button><p class="hello">Status: ${r.lanjut?'terbuka':'terkunci (hanya materi dasar)'}</p>`:''}<h3 class="shelf">🏅 Sertifikat</h3>`+(el.length?el.map(x=>certBtn(x,`showCert('${x.k}')`)).join(''):'<p class="hello">Belum ada materi yang selesai.</p>')+`<h3 class="shelf">🔑 Atur ulang kata sandi</h3><div class="fm"><input id="ns" placeholder="Kata sandi baru" maxlength="40"><button class="go" onclick="rs('${id}')">Simpan kata sandi baru</button><p class="er" id="er"></p></div><h3 class="shelf">Riwayat terbaru</h3>`+(r.rows.length?r.rows.map(x=>`<div class="lv" style="padding:8px 12px;margin-bottom:6px"><div><b>${esc((C[x[1]]||{t:x[1]}).t)}</b> · tingkat ${x[2]}<br><small>${x[0]} · ${x[1]==='puz'?x[3]+' langkah':x[3]+'/8 benar'} · ${'⭐'.repeat(x[4])||'☆'}</small></div></div>`).join(''):'<p class="hello">Belum ada nilai.</p>');
 }).catch(e=>alert(e));
}
function lanjut(id,ya){call('aturLanjut',U.tk,id,ya).then(()=>detail(id)).catch(e=>alert(e))}
function showCert(k){const x=elig(DC.pr,DC.hd).find(y=>y.k===k);set({v:'cert',cx:{n:DC.m.nama,kl:DC.m.kelas,k,s:x.s,m:x.m,g:(U.peran==='kepsek'?'Kepala Sekolah: ':'Guru: ')+U.nama,cb:'detail'}})}
function rs(id){const v=$$('#ns').value;call('resetSandi',U.tk,id,v).then(()=>{$$('#er').textContent='✅ Kata sandi sudah diganti.';$$('#ns').value=''}).catch(e=>{$$('#er').textContent=String(e)})}
render();load();
</script></body></html>
